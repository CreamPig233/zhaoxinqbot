napcat:
  ws_url: ws://127.0.0.1:3001/
  access_token: ""
  reconnect_seconds: 5

groups:
  recruit_group: 810192062
  admin_group: 1065588188

realname:
  enabled: true
  one_qq_one_identity: true
  mute_duration_seconds: 2592000
  admin_approvers: []
  prompt: "欢迎加入招新群。请私聊机器人提交实名信息，格式：实名 姓名 学号/工号 学院/部门"
  resubmit_prompt: "实名信息未通过审核，请按格式重新私聊提交：实名 姓名 学号/工号 学院/部门"

message_archive:
  enabled: true
  download_media: true

qa:
  enabled: true
  recall_after_seconds: 60
  confidence_threshold: 0.72
  llm:
    enabled: false
    api_url: https://api.openai.com/v1/chat/completions
    api_key: ""
    model: gpt-4o-mini
    timeout_seconds: 20
  preset_answers:
    - question: "怎么报名"
      answer: "请关注群公告中的报名链接，按要求填写信息并等待通知。"
      aliases:
        - "如何报名"
        - "报名方式"
    - question: "招新时间"
      answer: "招新时间以群公告为准，若有变动会在群内同步。"
      aliases:
        - "什么时候招新"
        - "招新什么时候开始"

storage:
  data_dir: data
