# strings.yaml
# -----------------------------------------------------------------------------
# 本文件集中管理机器人“会说出来/发出去/交给大模型看的文字”。
# 修改欢迎语、审核命令、审核通知模板、问答内容时，只需要改这里。
# 注意：OneBot 协议固定值（例如 send_group_msg、group_recall）不是展示文案，
# 因此仍保留在 Python 代码中，避免误改导致协议调用失败。

realname:
  # 用户私聊提交实名信息时使用的命令前缀。
  # 完整格式由 identity_format 配置，代码会按空白拆分：
  #   实名 姓名 学号/工号 学院/部门
  submit_command: "实名"

  # 管理群审核命令。审核人可以直接发送“批准 QQ号”，也可以回复审核通知发送“批准”。
  approve_command: "批准"

  # 管理群拒绝命令。支持“拒绝 QQ号 原因”，也支持回复审核通知发送“拒绝 原因”。
  reject_command: "拒绝"

  # 管理群取消某用户实名绑定的命令。
  revoke_command: "取消实名"

  # 展示给用户和管理员看的实名提交格式。
  identity_format: "实名 姓名 学号/工号 学院/部门"

  # 新成员入群被禁言后，机器人在招新群 @ 该成员时附带的提示。
  join_prompt: "欢迎加入招新群。请私聊机器人提交实名信息，格式：实名 姓名 学号/工号 学院/部门"

  # 管理员拒绝实名信息后，私聊通知用户重新提交的提示。
  resubmit_prompt: "实名信息未通过审核，请按格式重新私聊提交：实名 姓名 学号/工号 学院/部门"

  # 用户提交格式错误时的私聊提示。
  invalid_format: "格式不正确。请发送：实名 姓名 学号/工号 学院/部门"

  # 一人一实名开关开启时，发现该实名信息已被其他 QQ 使用的提示。
  duplicate_identity: "该实名信息已被其他 QQ 绑定，请联系管理员处理。"

  # 用户已有申请处于自动审核或人工审核期间时，拒绝重复提交的提示。
  duplicate_active_application: "你已有实名申请正在审核中，请等待当前审核完成后再提交。"

  # 用户提交后，外部 Python 审核文件正在处理时的提示。
  auto_reviewing: "实名信息已收到，正在自动审核，请稍候。"

  # 用户提交实名信息后收到的确认消息。
  submitted: "实名信息已提交，请等待管理员审核。"

  # 外部审核文件返回超时或调用超时时，私聊提示用户。
  manual_handoff: "移交管理员人工审核"

  # 自动审核接口返回 reject 时使用的默认原因。
  auto_reject_reason: "自动审核未通过"

  # 管理员发送拒绝命令但没有附带原因时使用的默认原因。
  manual_reject_reason: "管理员拒绝"

  # 管理员批准一个不存在的待审核用户时，发到管理群的提示。
  no_pending: "{user_id} 没有待审核实名信息。"

  # 管理员批准后，发到管理群的确认消息。
  approved_admin: "已批准 {user_id} 的实名信息，并解除禁言。"

  # 管理员批准后，私聊通知被审核用户。
  approved_user: "实名审核已通过，欢迎加入。"

  # 管理员拒绝后，发到管理群的确认消息。
  rejected_admin: "已拒绝 {user_id} 的实名信息。"

  # 管理员拒绝后，私聊通知被审核用户。reason 会被替换为拒绝原因。
  rejected_user: "{resubmit_prompt}\n原因：{reason}"

  # 管理员取消实名时，如果目标用户没有已通过记录，发到管理群的提示。
  no_verified: "{user_id} 当前没有已通过的实名信息。"

  # 管理员取消实名成功后，发到管理群的确认消息。
  revoked_admin: "已取消 {user_id} 的实名信息。"

  # 有新实名信息待审核时，发到管理群的通知模板。
  review_notice: |
    实名审核待处理
    申请ID：{application_id}
    QQ：{user_id}
    姓名：{name}
    编号：{identity_id}
    单位：{unit}
    请回复：批准 {user_id} 或 拒绝 {user_id} 原因

qa:
  # 调用大模型做“是否属于预设问题”分类时的系统提示词。
  llm_system_prompt: "你是严格的问题分类器。不要回答问题，只做分类。"

  # 调用大模型做分类时的用户提示词模板。
  # text 是用户消息，options 是预设问题 JSON。
  llm_user_prompt: |
    判断用户消息是否属于预设问题之一。只返回 JSON，格式：{{"index": 数字或 -1, "confidence": 0到1}}。
    用户消息：{text}
    预设问题：{options}

  # 预设问答列表。question 和 aliases 用于分类，answer 是命中后群内回复。
  preset_answers:
    - question: "怎么报名"
      aliases:
        - "如何报名"
        - "报名方式"
      answer: "请关注群公告中的报名链接，按要求填写信息并等待通知。"
    - question: "招新时间"
      aliases:
        - "什么时候招新"
        - "招新什么时候开始"
      answer: "招新时间以群公告为准，若有变动会在群内同步。"
