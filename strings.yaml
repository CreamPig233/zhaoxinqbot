# strings.yaml
# -----------------------------------------------------------------------------
# 本文件集中管理机器人“会说出来/发出去/写入日志/交给大模型看的文字”。
# 修改欢迎语、审核命令、审核通知模板、日志原因、问答内容时，只需要改这里。
#
# 字段用途标记：
#   [用户消息] 发送给申请用户，或在招新群中面向普通用户发送。
#   [管理员消息] 发送到管理群。
#   [日志记录] 作为实名申请状态原因写入 realname.json 和
#              realname_applications.jsonl；部分原因也会随通知发送给用户。
#   [输入命令] 由用户或管理员发给机器人，用于识别操作，不是机器人消息。
#   [模型提示] 只发送给配置的大模型接口，不会直接展示在 QQ 中。
#   [分类配置] 用于本地或大模型分类；answer 命中后作为用户消息发送到群内。
#   [当前未使用] 配置会被加载，但当前代码没有发送或读取它的值来决定行为。
# 注意：OneBot 协议固定值（例如 send_group_msg、group_recall）不是展示文案，
# 因此仍保留在 Python 代码中，避免误改导致协议调用失败。

realname:
  # [输入命令/用户] 用户私聊提交实名信息时使用的命令前缀。
  # 标准格式为“实名 姓名 学号”，也兼容常见中英文符号分隔。
  submit_command: "实名"

  # [输入命令/管理员] 审核人可以直接发送“批准 QQ号”，也可以回复审核通知发送“批准”。
  approve_command: "批准"

  # [输入命令/管理员] 支持“拒绝 QQ号 原因”，也支持回复审核通知发送“拒绝 原因”。
  reject_command: "拒绝"

  # [输入命令/管理员] 取消某用户实名绑定的命令。
  revoke_command: "取消实名"

  # [当前未使用] 用于集中展示标准格式；当前解析器固定读取姓名和学号两个字段。
  identity_format: "实名 姓名 学号"

  # [用户消息/招新群] 新成员入群被禁言后，机器人 @ 该成员时附带的提示。
  join_prompt: "欢迎加入招新群。请私聊机器人提交实名信息，格式：实名 姓名 学号"

  # [用户消息/招新群] 已通过实名认证的用户重新加入招新群时，机器人 @ 该成员时附带的欢迎语。
  verified_join_prompt: "欢迎回来，你已完成实名认证，可以直接参与群内交流。"

  # [用户消息/私聊] 管理员拒绝实名信息后，通知用户重新提交的提示。
  resubmit_prompt: "实名信息未通过审核，请按格式重新私聊提交：实名 姓名 学号。例如：实名 张三 20260000"

  # [用户消息/私聊] 用户提交格式错误时的提示。
  invalid_format: "格式不正确。请发送：实名 姓名 学号。例如：实名 张三 20260000"
  already_verified: "你已经完成实名认证，无需重复提交。"

  # [用户消息/私聊] 一人一实名开启时，发现实名信息已被其他 QQ 使用的提示。
  duplicate_identity: "该实名信息已被其他 QQ 绑定，请联系管理员处理。"

  # [用户消息/私聊] 已有申请处于自动或人工审核期间时，拒绝重复提交的提示。
  duplicate_active_application: "你已有实名申请正在审核中，请等待当前审核完成后再提交。"

  # [用户消息/私聊] 外部 Python 审核文件开始处理时的提示。
  auto_reviewing: "实名信息已收到，正在自动审核，请稍候。"

  # [当前未使用] 预留的提交确认消息；当前代码发送 auto_reviewing，而不发送此字段。
  submitted: "实名信息已提交，请等待管理员审核。"

  # [用户消息/私聊] 自动审核未给出批准或拒绝结果，转人工审核时的提示。
  manual_handoff: "移交管理员人工审核"

  # [日志记录 + 用户消息/私聊] 自动审核返回 reject 但未提供原因时的默认拒绝原因。
  auto_reject_reason: "自动审核未通过"

  # [日志记录] 外部审核函数运行或调用超时时的状态原因。
  auto_timeout_reason: "外部审核超时"

  # [日志记录] 外部审核函数抛出异常时的状态原因。
  auto_exception_reason: "外部审核异常：{error}"

  # [日志记录] 外部审核函数返回未知状态时的兜底原因。
  auto_unknown_reason: "外部审核返回未知状态：{status}"

  # [日志记录] 用户在审核完成前退群时的取消原因。
  left_group_cancel_reason: "用户退群，实名申请自动取消"

  # [日志记录 + 用户消息/私聊] 管理员拒绝但未附原因时使用，并随拒绝通知发给用户。
  manual_reject_reason: "管理员拒绝"

  # [管理员消息/管理群] 批准或拒绝不存在的待审核申请时的提示。
  no_pending: "{user_id} 没有待审核实名信息。"

  # [管理员消息/管理群] 批准后的确认消息。
  approved_admin: "已批准 {user_id} 的实名信息，并解除禁言。"

  # [用户消息/私聊] 批准后通知被审核用户。
  approved_user: "实名审核已通过，欢迎加入。"

  # [管理员消息/管理群] 拒绝后的确认消息。
  rejected_admin: "已拒绝 {user_id} 的实名信息。"

  # [用户消息/私聊] 拒绝后通知被审核用户；reason 会替换为拒绝原因。
  rejected_user: "{resubmit_prompt}\n原因：{reason}"

  # [管理员消息/管理群] 取消实名时，目标用户没有已通过记录的提示。
  no_verified: "{user_id} 当前没有已通过的实名信息。"

  # [管理员消息/管理群] 取消实名成功后的确认消息。
  revoked_admin: "已取消 {user_id} 的实名信息。"

  # [管理员消息/管理群] 有新实名信息转人工审核时的通知模板。
  review_notice: |
    实名审核待处理
    申请ID：{application_id}
    QQ：{user_id}
    姓名：{name}
    学号：{identity_id}
    请回复：批准 {user_id} 或 拒绝 {user_id} 原因

qa:
  # [模型提示] 做“是否属于预设问题”分类时发送给大模型的系统提示词。
  llm_system_prompt: "你是严格的问题分类器。不要回答问题，只做分类。"

  # [模型提示] 做分类时发送给大模型的用户提示词模板。
  # text 是用户消息，options 是预设问题 JSON。
  llm_user_prompt: |
    判断用户消息是否属于预设问题之一。只返回 JSON，格式：{{"index": 数字或 -1, "confidence": 0到1}}。
    用户消息：{text}
    预设问题：{options}

  # [分类配置] question 和 aliases 不发送；answer 命中后作为用户消息回复到原群。
  preset_answers:
    - question: "怎么报名"
      aliases:
        - "如何报名"
        - "报名方式"
      answer: "请关注群公告中的报名链接，按要求填写信息并等待通知。"
    - question: "招新时间"
      aliases:
        - "什么时候招新"
        - "招新什么时候开始"
      answer: "招新时间以群公告为准，若有变动会在群内同步。"
